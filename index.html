<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Own both color schemes so Android browsers (Chrome auto-dark, Samsung
         Internet "Web page darkening") don't run their force-dark pass on top
         of the app's own theme and produce a muddy double-darkened result. -->
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <title>secretary.ai</title>
    <!-- Apply the saved light/dark choice before the page paints (no flash). -->
    <script>
      try {
        var m = localStorage.getItem("theme-mode");
        var d = m === "dark" || (m !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (d) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
